<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f5eee3">
<title>Capodanno 2027 – Invito</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Invito di Capodanno">
<meta property="og:description" content=""><meta property="og:image" content="https://inanna79.github.io/capodanno-2027/anteprima%20wasap.jpg">
<meta name="twitter:card" content="summary_large_image">
<style>
:root{--ivory:#f5eee3;--paper:#fff9f0;--burgundy:#762d40;--gold:#b19a70;--ink:#38332f}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--ivory)}
body{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:18px 12px;color:var(--ink);font-family:Georgia,'Times New Roman',serif}
.scene{width:min(100%,560px);text-align:center;visibility:hidden}
.scene.ready{visibility:visible}
.book{position:relative;width:100%;aspect-ratio:1/1;perspective:1500px;isolation:isolate}
.inside{position:absolute;inset:0;overflow:hidden;background:var(--paper);}
.inside-art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
.invite-copy{position:absolute;z-index:2;inset:5% 8%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(7px,1.6vw,13px);text-align:center;padding:4% 7%;}
.date{margin:0;color:var(--burgundy);font:clamp(9px,2vw,12px)/1.5 Arial,sans-serif;letter-spacing:.15em;text-transform:uppercase}
.invite-copy h1{max-width:100%;margin:0;color:var(--burgundy);font-size:clamp(22px,5.5vw,35px);font-weight:normal;font-style:italic;line-height:1.18;text-wrap:balance}
.rule{flex:0 0 1px;width:46px;height:1px;background:var(--gold);margin:1px 0}
.time{margin:0;color:var(--ink);font-size:clamp(20px,4.7vw,28px);line-height:1.2}
.event{margin:0;font-size:clamp(13px,3vw,17px);line-height:1.45}
.address{margin:0;color:#76685a;font:clamp(11px,2.5vw,14px)/1.65 Arial,sans-serif}
.rsvp{margin:0;color:var(--burgundy);font:clamp(9px,2vw,12px)/1.5 Arial,sans-serif;letter-spacing:.22em}
#sky{position:absolute;z-index:1;inset:0;width:100%;height:100%;pointer-events:none}
.door{position:absolute;z-index:4;top:0;bottom:0;width:50%;background-image:url('copertina-capodanno.webp');background-repeat:no-repeat;background-size:200% 100%;transition:transform 1.35s cubic-bezier(.2,.75,.2,1);transform-style:preserve-3d;backface-visibility:hidden}
.door.left{left:0;background-position:left center;transform-origin:left center}
.door.right{right:0;background-position:right center;transform-origin:right center}
.book.open .door.left{transform:rotateY(-112deg)}
.book.open .door.right{transform:rotateY(112deg)}
.seal-control{position:absolute;z-index:7;left:50%;top:50%;width:min(33.2%,230px);aspect-ratio:555/543;transform:translate(-50%,-50%);padding:0;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;filter:drop-shadow(0 5px 5px #4b15202b)}
.seal-half{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.seal-half.left{clip-path:inset(0 49.5% 0 0);transform-origin:44% 50%}
.seal-half.right{clip-path:inset(0 0 0 49.5%);transform-origin:56% 50%}
.book.breaking .seal-half.left{animation:break-left .48s ease-in forwards}
.book.breaking .seal-half.right{animation:break-right .48s ease-in forwards}
@keyframes break-left{0%{transform:translateX(0) rotate(0);opacity:1}35%{transform:translateX(-2px) rotate(-2deg)}100%{transform:translate(-24px,5px) rotate(-13deg);opacity:0}}
@keyframes break-right{0%{transform:translateX(0) rotate(0);opacity:1}35%{transform:translateX(2px) rotate(2deg)}100%{transform:translate(24px,-4px) rotate(13deg);opacity:0}}
.seal-control:focus-visible{outline:2px solid var(--burgundy);outline-offset:7px;border-radius:50%}
.book.open .seal-control{pointer-events:none;visibility:hidden}
.hint{margin:18px 0 0;color:#786b5d;font:12px/1.6 Arial,sans-serif;letter-spacing:.04em}
.hint strong{color:var(--burgundy);font-weight:600}
@media(max-width:380px){.scene{width:100%}.invite-copy{gap:7px}.invite-copy h1{font-size:clamp(21px,6vw,27px)}.seal-control{width:42.3%}}
@media(prefers-reduced-motion:reduce){.door{transition-duration:.01ms}.book.breaking .seal-half.left,.book.breaking .seal-half.right{animation-duration:.01ms}}
</style>
</head>
<body>
<main class="scene">
 <div class="book" id="book">
  <section class="inside" aria-label="Dettagli dell'invito">
   <img class="inside-art" src="interno-capodanno.webp" alt="">
   <div class="invite-copy">
    <p class="date">31 DICEMBRE 2026</p>
    <h1>Ti aspettiamo per festeggiare il nuovo anno alle ore 20:30.</h1>    
    <div class="rule" aria-hidden="true"></div>
    <p class="address">Via dei Banchi Nuovi, 44<br>Citofono Gianni</p>
    <div class="rule" aria-hidden="true"></div>
    <p class="rsvp">RSVP</p>
   </div>
   <canvas id="sky" aria-hidden="true"></canvas>
  </section>
  <div class="door left" aria-hidden="true"></div>
  <div class="door right" aria-hidden="true"></div>
  <button class="seal-control" id="openButton" type="button" aria-label="Rompi il sigillo e apri l'invito">
   <img class="seal-half left" src="sigillo-capodanno.webp" alt="">
   <img class="seal-half right" src="sigillo-capodanno.webp" alt="">
  </button>
 </div>
 <p class="hint" id="hint">Tocca il <strong>sigillo</strong> per aprire l'invito</p>
</main>
<script>
(()=>{
  const scene=document.querySelector('.scene');
 const images=['copertina-capodanno.webp','interno-capodanno.webp','sigillo-capodanno.webp'];

 Promise.all(images.map(src=>{
  const img=new Image();
  img.src=src;
  return img.decode();
 })).then(()=>{
  requestAnimationFrame(()=>{
   requestAnimationFrame(()=>{
    scene.classList.add('ready');
   });
  });
 });
 const book=document.getElementById('book'),button=document.getElementById('openButton'),hint=document.getElementById('hint');
 let opened=false;
 button.addEventListener('click',()=>{
  if(opened)return;opened=true;book.classList.add('breaking');button.setAttribute('aria-label','Il sigillo si è rotto');hint.textContent='';
  window.setTimeout(()=>{book.classList.add('open');window.setTimeout(startFireworks,3000)},520);
 });
  const canvas=document.getElementById('sky'),ctx=canvas.getContext('2d');
 const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 let w=0,h=0,dpr=1,rockets=[],sparks=[],last=0,nextLaunch=0,elapsed=0,raf=0,running=false;
 const palette=['#641f35','#762d40','#96384b','#a7444e','#b88b50','#c39a5b','#d0ad75'];
 function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);w=r.width;h=r.height;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
 function launch(){const x=w*(.16+Math.random()*.68),targetY=h*(.16+Math.random()*.38);rockets.push({x,y:h+5,vx:(Math.random()-.5)*.55,vy:-(3.1+Math.random()*1.1),targetY,color:palette[Math.floor(Math.random()*palette.length)],trail:[]})}
 function burst(x,y,color){const n=34+Math.floor(Math.random()*22);for(let i=0;i<n;i++){const a=Math.PI*2*i/n+(Math.random()-.5)*.12,s=.65+Math.random()*2.05;const sparkle=Math.random()<.16;sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:55+Math.random()*38,max:93,size:.8+Math.random()*2.1,color:Math.random()<.72?color:palette[Math.floor(Math.random()*palette.length)],wobble:Math.random()*6.28,sparkle,sparkColor:Math.random()<.75?'#f5dca8':'#fffaf0'})}}
 function drawSpark(p,a){
 ctx.save();

 // Alone morbido originale
 ctx.globalAlpha=a*.23;
 ctx.fillStyle=p.color;
 ctx.filter='blur(3px)';
 ctx.beginPath();
 ctx.arc(p.x,p.y,p.size*2.7,0,Math.PI*2);
 ctx.fill();

 // Corpo della particella
 ctx.filter='none';
 ctx.globalAlpha=a*.72;
 ctx.fillStyle=p.color;
 ctx.beginPath();
 ctx.ellipse(p.x,p.y,p.size,p.size*(1.1+Math.sin(p.wobble)*.25),p.wobble*.1,0,Math.PI*2);
 ctx.fill();
  
// Scintilla oro champagne e bianco avorio
if(p.sparkle){
 ctx.globalAlpha=a*(.65+.25*Math.sin(p.wobble*2));
 ctx.fillStyle=p.sparkColor;
 ctx.beginPath();
 ctx.arc(p.x,p.y,Math.max(.65,p.size*.65),0,Math.PI*2);
 ctx.fill();
}

 ctx.restore();
} function frame(t){if(!last)last=t;const dt=Math.min(2,(t-last)/16.67);last=t;elapsed+=dt;ctx.clearRect(0,0,w,h);
  if(elapsed>=nextLaunch&&rockets.length<3&&sparks.length<280){launch();nextLaunch=elapsed+38+Math.random()*42}
  for(let i=rockets.length-1;i>=0;i--){const r=rockets[i];r.x+=r.vx*dt;r.y+=r.vy*dt;r.vy+=.025*dt;r.trail.push({x:r.x,y:r.y});if(r.trail.length>8)r.trail.shift();ctx.save();for(let j=0;j<r.trail.length;j++){const q=r.trail[j],a=(j+1)/r.trail.length;ctx.globalAlpha=a*.38;ctx.fillStyle=r.color;ctx.filter='blur('+(2.8-a*1.5)+'px)';ctx.beginPath();ctx.arc(q.x,q.y,1.5+a*1.2,0,Math.PI*2);ctx.fill()}ctx.restore();if(r.y<=r.targetY||r.vy>=-.2){burst(r.x,r.y,r.color);rockets.splice(i,1)}}
  for(let i=sparks.length-1;i>=0;i--){const p=sparks[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.985,dt);p.vy=p.vy*.985+.018*dt;p.wobble+=.07*dt;p.life-=dt;const a=Math.max(0,p.life/p.max);if(p.life<=0){sparks.splice(i,1);continue}drawSpark(p,a)}
  if(running)raf=requestAnimationFrame(frame)
 }
 function startFireworks(){if(running)return;resize();running=true;last=0;elapsed=0;nextLaunch=0;if(reduced){launch();const r=rockets.pop();burst(r.x,h*.34,r.color);for(const p of sparks)drawSpark(p,.7);return}raf=requestAnimationFrame(frame)}
 new ResizeObserver(()=>{resize()}).observe(canvas);window.addEventListener('resize',resize);resize();
})();
</script>
</body>
</html>
